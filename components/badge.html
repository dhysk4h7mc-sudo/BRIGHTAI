  <style>
    body { display: flex; gap: 1rem; padding: 2rem; flex-wrap: wrap; align-items: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-1);
      padding: var(--spacing-1) var(--spacing-3);
      border-radius: var(--radius-pill);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      line-height: 1.7;
      white-space: nowrap;
    }
    .badge--primary { background: rgba(99,102,241,0.15); color: #818cf8; }
    .badge--success { background: rgba(34,197,94,0.15); color: var(--color-success); }
    .badge--warning { background: rgba(245,158,11,0.15); color: var(--color-warning); }
    .badge--danger  { background: rgba(239,68,68,0.15); color: var(--color-danger); }
    .badge--info    { background: rgba(56,189,248,0.15); color: var(--color-info); }
    .badge--gold    { background: rgba(247,201,72,0.15); color: var(--color-brand-gold); }
    .badge--cyan    { background: rgba(103,232,249,0.15); color: var(--color-primary); }
    .badge--outline {
      background: transparent;
      border: 1px solid currentColor;
    }
    .badge--gradient {
      background: var(--gradient-primary);
      color: #fff;
    }
    .badge--dot::before {
      content: '';
      inline-size: 6px;
      block-size: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
  </style>
