  <style>
    /* ── Nav Shell ── */
    .unified-nav {
      position: fixed;
      inset-block-start: 0;
      inset-inline: 0;
      block-size: 72px;
      z-index: var(--z-nav);
      background: rgba(2,6,23,0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-block-end: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.35s ease, background 0.4s ease, border-bottom 0.4s ease, box-shadow 0.4s ease;
    }
    .unified-nav.scrolled {
      background: rgba(2,6,23,0.92);
      border-block-end-color: rgba(255,255,255,0.1);
      box-shadow: 0 4px 30px rgba(0,0,0,0.35);
    }
    .nav-container {
      max-inline-size: 1400px;
      margin: 0 auto;
      block-size: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 1.25rem;
      gap: 0.75rem;
    }
    @media (min-width: 1024px) {
      .nav-container { padding-inline: 2rem; gap: 1.5rem; }
    }

    /* ── Logo ── */
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      text-decoration: none;
      z-index: 1002;
      flex-shrink: 0;
    }
    .nav-logo-box {
      inline-size: 36px;
      block-size: 36px;
      border-radius: 0.625rem;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: var(--weight-black);
      font-size: 18px;
    }
    .nav-logo-text {
      display: flex;
      flex-direction: column;
    }
    .nav-logo-name {
      font-size: 1rem;
      font-weight: var(--weight-black);
      color: #fff;
      line-height: 1.2;
    }
    .nav-logo-tagline {
      font-size: 0.6875rem;
      color: var(--color-neutral-400);
      line-height: 1;
    }

    /* ── Links ── */
    .nav-links {
      display: none;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: 0.25rem;
    }
    @media (min-width: 1024px) {
      .nav-links { display: flex; align-items: center; }
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.875rem;
      color: #cbd5e1;
      font-size: 0.875rem;
      font-weight: var(--weight-medium);
      text-decoration: none;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }
    .nav-link:hover {
      color: #fff;
      background: rgba(255,255,255,0.06);
    }

    /* ── Dropdown ── */
    .nav-item { position: relative; }
    .dropdown-menu {
      position: absolute;
      inset-block-start: calc(100% + 0.5rem);
      inset-inline-end: 0;
      inset-inline-start: auto;
      inline-size: max-content;
      min-inline-size: 260px;
      background: rgba(10,15,30,0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 0.5rem;
      box-shadow: 0 24px 64px -16px rgba(0,0,0,0.8);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px);
      transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      z-index: 9999;
    }
    .nav-item:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.875rem;
      border-radius: 8px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.15s ease;
    }
    .dropdown-item:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
    }

    /* ── CTA ── */
    .nav-cta {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: var(--weight-semibold);
      font-size: 0.8125rem;
      border-radius: var(--radius-pill);
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 12px rgba(99,102,241,0.3);
    }
    .nav-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(99,102,241,0.45);
    }
    @media (min-width: 1024px) {
      .nav-cta { display: inline-flex; }
    }

    /* ── Mobile Toggle ── */
    .mobile-toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1002;
      padding: 8px;
      inline-size: 44px;
      block-size: 44px;
      transition: transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    @media (min-width: 1024px) {
      .mobile-toggle { display: none; }
    }
    .bar {
      inline-size: 22px;
      block-size: 2px;
      background: #fff;
      border-radius: 4px;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease;
    }
    .mobile-toggle[aria-expanded="true"] .bar:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .mobile-toggle[aria-expanded="true"] .bar:nth-child(2) { opacity: 0; }
    .mobile-toggle[aria-expanded="true"] .bar:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ── Spacer for demo ── */
    .demo-spacer { block-size: 120px; }
  </style>

  <script>
    const nav = document.getElementById('mainNav');
    const toggle = document.querySelector('.mobile-toggle');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 50);
    });
    toggle?.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', !expanded);
    });
  </script>
