<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGHTAI — Button Ghost</title>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
  <link rel="stylesheet" href="/frontend/css/asset-fonts.css">
</head>
<body style="display:flex;gap:1rem;padding:2rem;align-items:center;flex-wrap:wrap;min-height:100vh">

  <!-- ═══ Ghost Button ═══ -->
  <a href="#" class="btn-ghost">
    <iconify-icon icon="lucide:book-open" width="18"></iconify-icon>
    اقرأ المزيد
  </a>

  <button class="btn-ghost" type="button">
    <iconify-icon icon="lucide:share-2" width="18"></iconify-icon>
    مشاركة
  </button>

  <button class="btn-ghost" type="button" style="color:var(--color-danger);border-color:rgba(239,68,68,0.3)">
    <iconify-icon icon="lucide:trash-2" width="18"></iconify-icon>
    حذف
  </button>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</body>
</html>
