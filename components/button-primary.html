<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGHTAI — Button Primary</title>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
  <link rel="stylesheet" href="/frontend/css/asset-fonts.css">
</head>
<body style="display:flex;gap:1rem;padding:2rem;align-items:center;flex-wrap:wrap;min-height:100vh">

  <!-- ═══ Primary Button ═══ -->
  <a href="#" class="btn-primary">
    <iconify-icon icon="lucide:arrow-left" width="18"></iconify-icon>
    ابدأ الآن
  </a>

  <button class="btn-primary" type="button">
    <iconify-icon icon="lucide:sparkles" width="18"></iconify-icon>
    جرّب المنصة
  </button>

  <!-- Small variant -->
  <a href="#" class="btn-primary" style="padding-block:0.5rem;padding-inline:0.875rem;font-size:0.875rem">
    تواصل معنا
  </a>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

</html>
