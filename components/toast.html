<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGHTAI — Toast Notification</title>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
  <link rel="stylesheet" href="/frontend/css/asset-fonts.css">
  <style>
    body { display: flex; flex-direction: column; gap: 1rem; padding: 2rem; min-height: 100vh; }
    .toast-container {
      position: fixed;
      inset-block-start: var(--spacing-lg);
      inset-inline-end: var(--spacing-lg);
      z-index: var(--z-toast);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-3);
      max-inline-size: 400px;
    }
    .toast {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-3);
      padding: var(--spacing-4) var(--spacing-lg);
      background: #0b1220;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      animation: bai-fade-in var(--duration-slow) var(--ease-emphasized) both;
    }
    .toast-icon {
      flex-shrink: 0;
      inline-size: 20px;
      block-size: 20px;
      margin-block-start: 2px;
    }
    .toast-content { flex: 1; }
    .toast-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      color: var(--color-text);
      margin-block-end: var(--spacing-1);
    }
    .toast-message {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    .toast-close {
      flex-shrink: 0;
      inline-size: 28px;
      block-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--color-neutral-500);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-standard);
    }
    .toast-close:hover {
      background: rgba(255,255,255,0.08);
      color: var(--color-text);
    }
    .toast--success { border-inline-start: 3px solid var(--color-success); }
    .toast--success .toast-icon { color: var(--color-success); }
    .toast--error   { border-inline-start: 3px solid var(--color-danger); }
    .toast--error .toast-icon   { color: var(--color-danger); }
    .toast--warning { border-inline-start: 3px solid var(--color-warning); }
    .toast--warning .toast-icon { color: var(--color-warning); }
    .toast--info    { border-inline-start: 3px solid var(--color-info); }
    .toast--info .toast-icon    { color: var(--color-info); }
    /* Static demo positioning */
    .demo-toasts { position: static; max-inline-size: 100%; }
  </style>
</head>
<body>

  <h3 style="color:var(--color-text);font-size:var(--text-lg)">Toast Notifications</h3>

  <div class="demo-toasts">
    <!-- ═══ Success Toast ═══ -->
    <div class="toast toast--success">
      <iconify-icon class="toast-icon" icon="lucide:check-circle" width="20"></iconify-icon>
      <div class="toast-content">
        <div class="toast-title">تم النشر بنجاح</div>
        <div class="toast-message">تم نشر النموذج "محلل المخاطر v2.1" في بيئة الإنتاج.</div>
      </div>
      <button class="toast-close" aria-label="إغلاق">
        <iconify-icon icon="lucide:x" width="14"></iconify-icon>
      </button>
    </div>

    <!-- ═══ Error Toast ═══ -->
    <div class="toast toast--error">
      <iconify-icon class="toast-icon" icon="lucide:alert-circle" width="20"></iconify-icon>
      <div class="toast-content">
        <div class="toast-title">فشل النشر</div>
        <div class="toast-message">لم يتم اجتياز فحص الامتثال. يرجى مراجعة السياسات وإعادة المحاولة.</div>
      </div>
      <button class="toast-close" aria-label="إغلاق">
        <iconify-icon icon="lucide:x" width="14"></iconify-icon>
      </button>
    </div>

    <!-- ═══ Warning Toast ═══ -->
    <div class="toast toast--warning">
      <iconify-icon class="toast-icon" icon="lucide:alert-triangle" width="20"></iconify-icon>
      <div class="toast-content">
        <div class="toast-title">تنبيه أداء</div>
        <div class="toast-message">دقة النموذج انخفضت عن الحد المسموح (85%).</div>
      </div>
      <button class="toast-close" aria-label="إغلاق">
        <iconify-icon icon="lucide:x" width="14"></iconify-icon>
      </button>
    </div>

    <!-- ═══ Info Toast ═══ -->
    <div class="toast toast--info">
      <iconify-icon class="toast-icon" icon="lucide:info" width="20"></iconify-icon>
      <div class="toast-content">
        <div class="toast-title">تحديث جديد</div>
        <div class="toast-message">تم إضافة 12 معيار جديد لسياسات حوكمة الذكاء الاصطناعي.</div>
      </div>
      <button class="toast-close" aria-label="إغلاق">
        <iconify-icon icon="lucide:x" width="14"></iconify-icon>
      </button>
    </div>
  </div>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</body>
</html>
