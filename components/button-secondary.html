<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGHTAI — Button Secondary</title>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
  <link rel="stylesheet" href="/frontend/css/asset-fonts.css">
</head>
<body style="display:flex;gap:1rem;padding:2rem;align-items:center;flex-wrap:wrap;min-height:100vh">

  <!-- ═══ Secondary Button ═══ -->
  <a href="#" class="btn-secondary">
    <iconify-icon icon="lucide:eye" width="18"></iconify-icon>
    عرض التفاصيل
  </a>

  <button class="btn-secondary" type="button">
    <iconify-icon icon="lucide:download" width="18"></iconify-icon>
    تحميل التقرير
  </button>

  <!-- Disabled state -->
  <button class="btn-secondary" disabled style="opacity:0.5;pointer-events:none">
    غير متاح
  </button>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</body>
</html>
