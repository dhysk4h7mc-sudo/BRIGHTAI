<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIGHTAI — Search Form</title>
  <link rel="stylesheet" href="/frontend/css/design-system.css">
  <link rel="stylesheet" href="/frontend/css/asset-fonts.css">
  <style>
    .search-form {
      position: relative;
      max-inline-size: 480px;
    }
    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      inset-inline-start: 1rem;
      color: var(--color-neutral-500);
      pointer-events: none;
      transition: color var(--duration-base) var(--ease-standard);
    }
    .search-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-pill);
      padding-block: 0.72rem;
      padding-inline-start: 2.75rem;
      padding-inline-end: 1rem;
      color: var(--color-text);
      font-family: var(--font-ar);
      font-size: var(--text-sm);
      inline-size: 100%;
      min-block-size: var(--tap-target);
      outline: none;
      transition: all var(--duration-base) var(--ease-standard);
    }
    .search-input:focus {
      background: rgba(255,255,255,0.07);
      border-color: rgba(99,102,241,0.3);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .search-input:focus + .search-icon,
    .search-input:focus ~ .search-icon {
      color: var(--color-primary);
    }
    .search-input::placeholder {
      color: var(--color-neutral-500);
    }
    .search-kbd {
      position: absolute;
      inset-inline-end: 0.75rem;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--color-neutral-500);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.125rem 0.375rem;
      border-radius: 6px;
      pointer-events: none;
    }
    /* Desktop Search (expanded) */
    .search-desktop {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      padding-block: 0.5rem;
      padding-inline: 0.875rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-standard);
      max-inline-size: 240px;
    }
    .search-desktop:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(99,102,241,0.3);
      color: var(--color-text);
    }
    .search-desktop span {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
    }
  </style>
</head>
<body style="display:flex;flex-direction:column;gap:2rem;padding:2rem;align-items:center;justify-content:center;min-height:100vh">

  <h3 style="color:var(--color-text);font-size:var(--text-lg)">بحث موسع</h3>

  <!-- ═══ Full Search Input ═══ -->
  <form class="search-form" role="search">
    <div class="search-input-wrap">
      <input type="search" class="search-input" placeholder="ابحث في المنصة..." aria-label="بحث">
      <iconify-icon class="search-icon" icon="lucide:search" width="18"></iconify-icon>
      <kbd class="search-kbd">⌘K</kbd>
    </div>
  </form>

  <h3 style="color:var(--color-text);font-size:var(--text-lg)">بحث مختصر (التنقل)</h3>

  <!-- ═══ Desktop Nav Search ═══ -->
  <button class="search-desktop" type="button" aria-label="فتح البحث">
    <iconify-icon icon="lucide:search" width="16"></iconify-icon>
    <span>بحث...</span>
    <kbd class="search-kbd" style="position:static">⌘K</kbd>
  </button>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</body>
</html>
