<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#060914"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0,212,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="inner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,212,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,212,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- Shield Shape -->
  <path d="M256 72 L408 152 V288 C408 372 340 424 256 448 C172 424 104 372 104 288 V152 Z"
        fill="none" stroke="url(#shield-grad)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Inner shield fill -->
  <path d="M256 92 L392 166 V284 C392 358 332 406 256 428 C180 406 120 358 120 284 V166 Z"
        fill="url(#inner-glow)" opacity="0.5"/>
  <!-- AI Brain / Circuit Symbol -->
  <g transform="translate(256,260)" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round">
    <!-- Central node -->
    <circle cx="0" cy="0" r="16" fill="#00d4ff" opacity="0.3" stroke="#00d4ff" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#00d4ff"/>
    <!-- Connections radiating out -->
    <line x1="16" y1="0" x2="48" y2="-24"/>
    <line x1="-16" y1="0" x2="-48" y2="-24"/>
    <line x1="0" y1="16" x2="0" y2="50"/>
    <line x1="12" y1="-12" x2="36" y2="-56"/>
    <line x1="-12" y1="-12" x2="-36" y2="-56"/>
    <!-- Outer nodes -->
    <circle cx="48" cy="-24" r="8" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="48" cy="-24" r="3" fill="#00d4ff"/>
    <circle cx="-48" cy="-24" r="8" fill="#7c5cff" opacity="0.2" stroke="#7c5cff" stroke-width="2"/>
    <circle cx="-48" cy="-24" r="3" fill="#7c5cff"/>
    <circle cx="0" cy="50" r="8" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="0" cy="50" r="3" fill="#00d4ff"/>
    <circle cx="36" cy="-56" r="6" fill="#7c5cff" opacity="0.2" stroke="#7c5cff" stroke-width="2"/>
    <circle cx="36" cy="-56" r="2.5" fill="#7c5cff"/>
    <circle cx="-36" cy="-56" r="6" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="-36" cy="-56" r="2.5" fill="#00d4ff"/>
    <!-- Bottom connections -->
    <line x1="16" y1="8" x2="44" y2="32"/>
    <line x1="-16" y1="8" x2="-44" y2="32"/>
    <circle cx="44" cy="32" r="6" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="44" cy="32" r="2.5" fill="#00d4ff"/>
    <circle cx="-44" cy="32" r="6" fill="#7c5cff" opacity="0.2" stroke="#7c5cff" stroke-width="2"/>
    <circle cx="-44" cy="32" r="2.5" fill="#7c5cff"/>
  </g>
  <!-- "B" letter at top of shield -->
  <text x="256" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="42" fill="#00d4ff" opacity="0.9">B</text>
</svg>
