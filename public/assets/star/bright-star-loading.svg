<?xml version="1.0" encoding="UTF-8"?>
<!--
  bright-star-loading.svg — Loading state variant.
  Same hero shape, with breathing rings to indicate activity.
  Use for: page transitions, lazy reveals, previews.
  Embedded animations are CSS-free — loaders use the parent .loading class.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="نجمة BrightAI في حالة تحميل">
  <defs>
    <linearGradient id="ld-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="ld-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="240" cy="180" r="180" fill="url(#ld-halo)"/>
  <circle cx="240" cy="180" r="160" fill="url(#ld-halo)" opacity="0.5"/>

  <!-- Top cube (faint, only as silhouette while loading) -->
  <path d="M240 38 L320 78 L240 118 L160 78 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3"/>
  <path d="M160 78 L240 118 L240 162 L160 122 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3"/>
  <path d="M320 78 L240 118 L240 162 L320 122 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Connection lines -->
  <line x1="240" y1="166" x2="240" y2="200" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 4"/>

  <!-- Pulsing kernel -->
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="url(#ld-shield)" fill-opacity="0.95"/>
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.85" stroke-linejoin="round"/>
  <!-- Inner lock -->
  <g transform="translate(240,260)" stroke="#0a0e1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-9" y="-2" width="18" height="14" rx="2" fill="#0a0e1a" fill-opacity="0.15"/>
    <path d="M-6 -2 V-7 A6 6 0 0 1 6 -7 V-2"/>
    <circle cx="0" cy="6" r="1.6" fill="#0a0e1a" fill-opacity="0.8" stroke="none"/>
  </g>

  <line x1="240" y1="320" x2="240" y2="354" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 4"/>

  <!-- Bottom layer (faint) -->
  <path d="M240 314 L320 354 L240 394 L160 354 Z" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.3" transform="translate(0,-12)"/>
</svg>
