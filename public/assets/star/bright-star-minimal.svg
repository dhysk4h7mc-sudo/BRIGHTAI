<?xml version="1.0" encoding="UTF-8"?>
<!--
  bright-star-minimal.svg — Small brand mark (32px).
  For: footer logo, small icons, watermarks.
  Optimized: only shield + minimal label, no decorative extras.
  Size target: <2KB.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BrightAI">
  <defs>
    <linearGradient id="sm-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Outer hex shield -->
  <path d="M32 8 L52 19 L52 45 L32 56 L12 45 L12 19 Z" fill="url(#sm-shield)" fill-opacity="0.95"/>
  <path d="M32 8 L52 19 L52 45 L32 56 L12 45 L12 19 Z" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-opacity="0.85" stroke-linejoin="round"/>
  <!-- Inner lock glyph -->
  <g transform="translate(32,32)" stroke="#0a0e1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-8" y="-2" width="16" height="13" rx="2" fill="#0a0e1a" fill-opacity="0.15"/>
    <path d="M-5 -2 V-7 A5 5 0 0 1 5 -7 V-2"/>
    <circle cx="0" cy="5" r="1.4" fill="#0a0e1a" fill-opacity="0.8" stroke="none"/>
  </g>
</svg>
