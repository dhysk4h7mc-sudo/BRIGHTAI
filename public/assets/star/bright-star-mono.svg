<?xml version="1.0" encoding="UTF-8"?>
<!--
  bright-star-mono.svg — Monochromatic version for 404 / errors.
  Single-color (cyan only) — works on dark backgrounds.
  Includes a subtle "broken connection" line on the kernel layer for error context.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="نواة BrightAI في وضع 404">
  <defs>
    <linearGradient id="mo-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Top: broken/empty (signal of disconnection) -->
  <path d="M240 38 L320 78 L240 118 L160 78 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <path d="M160 78 L160 122 L240 162 L240 118 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3"/>
  <path d="M320 78 L320 122 L240 162 L240 118 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3"/>
  <text x="240" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee" fill-opacity="0.7" font-family="IBM Plex Sans Arabic, sans-serif">الموظف</text>

  <!-- Broken connector (jagged dashed) -->
  <path d="M240 166 L235 180 L245 192 L240 200" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.6" fill="none" stroke-linecap="round" stroke-dasharray="2 4"/>

  <!-- Kernel: dimmed (defensive guard still on) -->
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="url(#mo-shield)" fill-opacity="0.6"/>
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6" stroke-linejoin="round" stroke-dasharray="3 3"/>
  <text x="240" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#22d3ee" fill-opacity="0.85" font-family="IBM Plex Sans Arabic, sans-serif">النواة</text>

  <!-- Bottom: outlined only -->
  <path d="M240 314 L320 354 L240 394 L160 354 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 3" transform="translate(0,-12)"/>
</svg>
