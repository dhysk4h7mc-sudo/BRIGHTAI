<?xml version="1.0" encoding="UTF-8"?>
<!--
  bright-star-hero.svg — BrightAI Hero Star (static version).
  Standalone version of src/components/brand/BrightStar.astro (variant=hero).
  Self-contained, no external assets, no animation.
  Size target: <8KB (currently ~6.5KB).
  Use for: hero, illustrations, social cards.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="نواة أمان BrightAI بين الموظف والذكاء الاصطناعي والبيانات">
  <title>نواة أمان BrightAI</title>
  <desc>رسم يبيّن ثلاث طبقات: الموظف في الأعلى، نواة الأمان (Kernel) في الوسط، والذكاء الاصطناعي والبيانات في الأسفل.</desc>
  <defs>
    <linearGradient id="bs-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bs-shield-edge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="bs-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bs-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bs-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="180" r="160" fill="url(#bs-halo)"/>

  <!-- TOP: Employee cube -->
  <path d="M240 38 L320 78 L240 118 L160 78 Z" fill="url(#bs-top)" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55"/>
  <path d="M160 78 L160 122 L240 162 L240 118 Z" fill="#0f1525" fill-opacity="0.85" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4"/>
  <path d="M320 78 L320 122 L240 162 L240 118 Z" fill="#0f1525" fill-opacity="0.65" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4"/>
  <g transform="translate(240,78)" stroke="#a5f3fc" stroke-width="1.4" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-8" r="6" fill="#22d3ee" fill-opacity="0.35"/>
    <path d="M-10 8 C-7 0 -3 -2 0 -2 C3 -2 7 0 10 8"/>
  </g>
  <text x="240" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#a5f3fc" fill-opacity="0.85" font-family="IBM Plex Sans Arabic, sans-serif">الموظف</text>

  <!-- Connector top → kernel -->
  <line x1="240" y1="166" x2="240" y2="200" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2 4" stroke-linecap="round"/>

  <!-- MIDDLE: Kernel shield -->
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="url(#bs-shield)" fill-opacity="0.95"/>
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="url(#bs-shield-edge)" fill-opacity="0.4"/>
  <path d="M240 200 L300 230 L300 290 L240 320 L180 290 L180 230 Z" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.85" stroke-linejoin="round"/>
  <g transform="translate(240,260)" stroke="#0a0e1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-9" y="-2" width="18" height="14" rx="2" fill="#0a0e1a" fill-opacity="0.15"/>
    <path d="M-6 -2 V-7 A6 6 0 0 1 6 -7 V-2"/>
    <circle cx="0" cy="6" r="1.6" fill="#0a0e1a" fill-opacity="0.8" stroke="none"/>
  </g>
  <text x="240" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#22d3ee" font-family="IBM Plex Sans Arabic, sans-serif">النواة</text>

  <!-- Connector kernel → bottom -->
  <line x1="240" y1="320" x2="240" y2="354" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2 4" stroke-linecap="round"/>

  <!-- BOTTOM: AI + data -->
  <g fill="#818cf8" fill-opacity="0.9">
    <path d="M96 214 L99 225 L110 228 L99 231 L96 242 L93 231 L82 228 L93 225 Z"/>
    <path d="M388 242 L390 250 L397 252 L390 254 L388 261 L386 254 L379 252 L386 250 Z" fill="#a5b4fc" fill-opacity="0.85"/>
  </g>
  <g fill="#818cf8" fill-opacity="0.55">
    <circle cx="135" cy="248" r="1.5"/><circle cx="155" cy="244" r="1.5"/><circle cx="175" cy="248" r="1.5"/><circle cx="195" cy="244" r="1.5"/>
    <circle cx="135" cy="264" r="1.5"/><circle cx="155" cy="260" r="1.5"/><circle cx="175" cy="264" r="1.5"/><circle cx="195" cy="260" r="1.5"/>
    <circle cx="285" cy="278" r="1.5"/><circle cx="305" cy="274" r="1.5"/><circle cx="325" cy="278" r="1.5"/><circle cx="345" cy="274" r="1.5"/>
  </g>
  <path d="M240 314 L320 354 L240 394 L160 354 Z" fill="url(#bs-bottom)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" opacity="0.85" transform="translate(0,-12)"/>
</svg>
