    runtime: node
    name: brightai-api
    rootDir: frontend
    buildCommand: npm ci --include=dev --no-audit --no-fund
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
