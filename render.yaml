  - type: web
    runtime: static
    name: brightai-site
    buildCommand: |
      set -eu
      npm ci --include=dev --no-audit --no-fund
      npm run assets:minify
      npm run assets:replace-refs
      npm run production:fixes
      npm run schema:solutions:sync
      npm run sitemap:all

      rm -rf .render-static
      mkdir -p .render-static
      rsync -a --delete \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='.render-static' \
        --exclude='.agents' \
        --exclude='plugins' \
        --exclude='reports' \
        --exclude='report' \
        --exclude='tmp' \
        --exclude='backend' \
        --exclude='app' \
        --exclude='components' \
        --exclude='lib' \
        --exclude='scripts' \
        --exclude='frontend/tests' \
        --exclude='frontend/scripts' \
        --exclude='frontend/*.test.js' \
        --exclude='frontend/*.e2e.test.js' \
        --exclude='frontend/*.spec.js' \
        --exclude='frontend/vitest.config.*' \
        --exclude='next.config.*' \
        --exclude='next-env.d.ts' \
        --exclude='tsconfig*.json' \
        --exclude='package*.json' \
        --exclude='render.yaml' \
        --exclude='*.md' \
        --exclude='.env' \
        --exclude='.env.*' \
        --exclude='*.sqlite' \
        --exclude='*.db' \
        --exclude='*.sql' \
        --exclude='*.log' \
        ./ .render-static/

      node <<'NODE'
      const fs = require("fs");
      const path = require("path");

      const root = path.join(process.cwd(), ".render-static");

      function ensureDir(filePath) {
        fs.mkdirSync(path.dirname(filePath), { recursive: true });
      }

      function removeIfExists(relativePath) {
        const target = path.join(root, relativePath);
        if (fs.existsSync(target)) fs.rmSync(target, { recursive: true, force: true });
      }

      function moveHtmlToIndex(filePath) {
        if (!fs.existsSync(filePath) || !filePath.endsWith(".html")) return;
        const basename = path.basename(filePath);
        if (["index.html", "404.html", "500.html", "error.html"].includes(basename)) return;

        const destination = path.join(path.dirname(filePath), basename.slice(0, -5), "index.html");
        if (!fs.existsSync(destination)) {
          ensureDir(destination);
          fs.copyFileSync(filePath, destination);
        }
        fs.rmSync(filePath, { force: true });
      }

      function walkHtml(dir, visitor) {
        if (!fs.existsSync(dir)) return;
        for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
          const fullPath = path.join(dir, entry.name);
          if (entry.isDirectory()) walkHtml(fullPath, visitor);
          if (entry.isFile() && entry.name.endsWith(".html")) visitor(fullPath);
        }
      }

      // Convert real .html application pages to clean canonical /path/ URLs.
      // Components such as frontend/components/nav.html are intentionally left unchanged because the app fetches them directly.
      for (const dir of [
        "blog",
        "docs",
        "dashboard",
        "hub",
        "solutions",
        "assessment",
        "trust"
      ]) {
        walkHtml(path.join(root, dir), moveHtmlToIndex);
      }
      NODE

